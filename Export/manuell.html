    <div class="container" style="display: flex; flex-direction: column; flex: 1; margin-bottom: 5rem;">
        <h1>Manuelle Suche</h1>
        <div class="progress">
            <div class="progress-bar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" style="width: 50%;">50%</div>
        </div>
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">Hier kannst schnell nach konrekten Ärzten <br>durch folgende Vorauswahl suchen:</h4>
                <form class="w-100"><label class="form-label">Fachgebiet</label><select class="form-select">
                        <option value="12" selected="">Psychotherapie</option>
                        <option value="13">Psychiatrie</option>
                    </select><label class="form-label">Zusatzbezeichnung</label><select class="form-select">
                        <option value="12" selected="">Keine</option>
                        <option value="13">Psychoanalyse</option>
                    </select><label class="form-label">Genehmigunsspflichtige Leistungen</label><select class="form-select">
                        <option value="12" selected="">Keine</option>
                        <option value="13">Verhaltenstherapie</option>
                        <option value="13">Psychoanalyse</option>
                    </select>
                    <div class="form-check"><input class="form-check-input" type="checkbox" id="formCheck-1"><label class="form-check-label" for="formCheck-1">Ausbildungsinstitute Inkudieren</label></div>
                </form>
            </div>
        </div>
        <div class="d-flex flex-column gap-3 pb-2" id="navigation-buttons" style="position: fixed; bottom: 0; left: 0; right: 0; background: transparent; padding: 1rem; z-index: 1000;"><button class="btn btn-primary w-100" type="button">Weiter</button><button class="btn btn-primary w-100" type="button" style="background: var(--cream-400) !important;">Zurück</button></div>
    </div>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script>
        const cards = document.querySelectorAll('.card');
        const progressBar = document.querySelector('.progress-bar');
        let currentCard = 0;

        // Calculate progress percentage
        const updateProgress = () => {
          const progress = ((currentCard + 1) / (cards.length)) * 100;
          progressBar.style.width = progress + '%';
          progressBar.textContent = Math.round(progress) + '%';
          progressBar.setAttribute('aria-valuenow', Math.round(progress));
        };

        // Hide all cards except the first one
        cards.forEach((card, index) => {
          card.style.display = index === 0 ? 'block' : 'none';
        });

        // Initialize progress bar
        updateProgress();

        // Get the navigation buttons
        const buttons = document.querySelectorAll('#navigation-buttons .btn-primary');
        const weiterBtn = buttons[0];
        const zurueckBtn = buttons[1];

        weiterBtn.addEventListener('click', () => {
          if (currentCard < cards.length - 1) {
            cards[currentCard].style.display = 'none';
            currentCard++;
            cards[currentCard].style.display = 'block';
            updateProgress();
          } else {
            window.location.href = 'ergebnisse.html';
          }
        });

        zurueckBtn.addEventListener('click', () => {
          if (currentCard > 0) {
            cards[currentCard].style.display = 'none';
            currentCard--;
            cards[currentCard].style.display = 'block';
            updateProgress();
          } else {
            window.location.href = 'index.html';
          }
        });
    </script>
