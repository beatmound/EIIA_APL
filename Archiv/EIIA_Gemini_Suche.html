<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datenbanksuche Mockup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Rahmen für den Mobile-Look */
        .phone-screen {
            border: 4px solid #e0e0e0;
            border-radius: 30px;
            width: 100%;
            max-width: 350px; /* Begrenzte Breite für Desktop-Ansicht */
            height: 700px;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
        }
        
        /* Flexibler Inhaltsbereich */
        .content-area {
            flex-grow: 1;
            padding: 2rem 1.5rem;
            overflow-y: auto;
        }

        /* Styling für die runden Eingabefelder passend zum Mockup */
        .custom-input {
            border-radius: 20px;
            border: 2px solid #e9ecef;
            padding: 0.375rem 1rem;
            font-size: 0.9rem;
        }

        /* Unterer Bereich für die Buttons */
        .bottom-actions {
            padding: 1rem 1.5rem 0.5rem 1.5rem;
        }
        
        .footer-nav {
            padding: 0 1.5rem 1.5rem 1.5rem;
            display: flex;
            gap: 10px;
        }

        /* Button-Farben anpassen */
        .btn-custom-light {
            background-color: #e9ecef;
            border: none;
            color: #212529;
            font-size: 1.1rem;
            padding: 0.5rem;
        }
        
        .btn-custom-footer {
            background-color: #e9ecef;
            border: none;
            color: #212529;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="bg-light p-4">

    <div class="text-center mb-4">
        <h1 class="display-5">Die Suche</h1>
        <p class="text-muted">Datenbanksuche</p>
    </div>

    <div class="phone-screen shadow-sm">
        
        <div class="content-area">
            <p class="fs-4 mb-5">Hier kannst Du nach einem konkreten Arzt suchen.</p>
            
            <form>
                <div class="row mb-3 align-items-center">
                    <label for="inputName" class="col-3 col-form-label ps-1">Name</label>
                    <div class="col-9">
                        <input type="text" class="form-control custom-input" id="inputName" placeholder="Eingabefeld">
                    </div>
                </div>
                
                <div class="row mb-3 align-items-center">
                    <label for="inputOrt" class="col-3 col-form-label ps-1">Ort</label>
                    <div class="col-9">
                        <input type="text" class="form-control custom-input" id="inputOrt" placeholder="Eingabefeld">
                    </div>
                </div>
                
                <div class="row mb-3 align-items-center">
                    <label for="inputPLZ" class="col-3 col-form-label ps-1">PLZ</label>
                    <div class="col-9">
                        <input type="text" class="form-control custom-input" id="inputPLZ" placeholder="Eingabefeld">
                    </div>
                </div>
                
                <div class="form-check mt-4 ms-1">
                    <input class="form-check-input" type="checkbox" id="checkAusbildung">
                    <label class="form-check-label text-muted" for="checkAusbildung" style="font-size: 0.75rem; padding-top: 2px;">
                        Bei der Suche Ausbildungsinstitute inkludieren
                    </label>
                </div>
            </form>
        </div>

        <div class="bottom-actions">
            <button class="btn btn-custom-light w-100 rounded-pill mb-3">Weiter</button>
            <button class="btn btn-custom-light w-100 rounded-pill mb-2">Zurück</button>
        </div>

        <div class="footer-nav">
            <button class="btn btn-custom-footer w-50 rounded-pill">Home</button>
            <button class="btn btn-custom-footer w-50 rounded-pill">Notfall</button>
        </div>

    </div>

</body>
</html>
